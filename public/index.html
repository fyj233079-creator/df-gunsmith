<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04070d">
<title>三角洲改枪码库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%234fe3ff%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27none%27 stroke=%27%234fe3ff%27 stroke-width=%272%27/%3E%3Cpath d=%27M16 1v8M16 23v8M1 16h8M23 16h8%27 stroke=%27%234fe3ff%27 stroke-width=%272%27/%3E%3C/svg%3E">
<meta name="description" content="三角洲行动烽火地带 / 全面战场 / 黑潮爆破改枪码实时聚合，多源去重，一键复制。">
<style>
@font-face{font-family:Rajdhani;font-weight:500;font-display:swap;src:url(fonts/rajdhani-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Rajdhani;font-weight:600;font-display:swap;src:url(fonts/rajdhani-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Rajdhani;font-weight:700;font-display:swap;src:url(fonts/rajdhani-latin-700-normal.woff2) format("woff2")}

:root{
  color-scheme:dark;
  --void:#04070d;      /* 底 */
  --deck:#0a1220;      /* 面板 */
  --deck2:#0d1828;
  --grid:#13233a;      /* 网格 / 分隔 */
  --edge:#1d3554;      /* 描边 */
  --holo:#4fe3ff;      /* 全息青：交互、改枪码 */
  --holo-dim:#2a7f97;
  --amber:#ffb547;     /* 造价 */
  --alert:#ff4d5e;     /* NEW / 下架 / 负值 */
  --ok:#5dffb0;
  --text:#d6e6f5;
  --muted:#7891ab;
  --dim:#4a6079;
  --hud:Rajdhani,"PingFang SC","Microsoft YaHei",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --cut:10px;
}
*{box-sizing:border-box}
html{background:var(--void);overflow-x:clip}
body{overflow-x:clip}
body{
  margin:0;color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:
    radial-gradient(1200px 500px at 50% -120px,rgba(79,227,255,.13),transparent 70%),
    linear-gradient(var(--void),var(--void));
}
/* 全息网格 */
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--void)}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(79,227,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(79,227,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 85%);
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));position:relative;z-index:1}
.num{font-family:var(--hud);font-variant-numeric:tabular-nums}

/* ============ 顶栏 ============ */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;overflow:hidden;background:rgba(4,7,13,.82);backdrop-filter:blur(12px) saturate(1.2);border-bottom:1px solid var(--edge)}
header:after{ /* 启动扫描线：仅加载时一次 */
  content:"";position:absolute;left:0;bottom:-1px;height:1px;width:30%;
  background:linear-gradient(90deg,transparent,var(--holo),transparent);
  animation:scan 1.6s cubic-bezier(.6,0,.2,1) .2s 1 both;
}
@keyframes scan{from{transform:translateX(-100%);opacity:1}to{transform:translateX(340%);opacity:0}}
.top{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.radar{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--holo);position:relative;flex:none;
  background:radial-gradient(circle,transparent 38%,rgba(79,227,255,.25) 39%,transparent 41%);overflow:hidden;box-shadow:0 0 14px rgba(79,227,255,.35)}
.radar:before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(79,227,255,.55),transparent 70deg);animation:sweep 3.2s linear infinite}
.radar:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--holo)}
@keyframes sweep{to{transform:rotate(360deg)}}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.06em}
.brand p{margin:0;font:600 12px var(--hud);color:var(--holo-dim);letter-spacing:.12em}

.link{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sig{display:flex;align-items:flex-end;gap:2px;height:14px}
.sig i{width:3px;background:var(--dim);border-radius:1px}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:9px}.sig i:nth-child(3){height:14px}
.link.on .sig i{background:var(--holo);box-shadow:0 0 6px var(--holo)}
.link.on .sig i:nth-child(3){animation:blink 2.4s steps(1) infinite}
.link.poll .sig i:nth-child(-n+2){background:var(--amber)}
@keyframes blink{50%{opacity:.25}}
.link b{font-weight:600;color:var(--text)}

.btn{
  --c:var(--edge);
  height:34px;padding:0 14px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  background:linear-gradient(var(--deck),var(--deck)) padding-box,linear-gradient(var(--c),var(--c)) border-box;border:1px solid transparent;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.btn:hover{--c:var(--holo)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:2px;background:var(--alert);color:#fff;font:700 12px/18px var(--hud);text-align:center}
.badge[hidden]{display:none}

/* 读数条 */
.readout{display:flex;gap:28px;align-items:baseline;padding:18px 0 4px;flex-wrap:wrap}
.readout div{display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:12.5px}
.readout .num{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.readout .first .num{color:var(--holo);text-shadow:0 0 18px rgba(79,227,255,.45)}

/* 模式切换：斜切标签 */
.modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 0 0}
.modes button{
  border:0;cursor:pointer;padding:9px 22px 8px;font-weight:700;letter-spacing:.04em;color:var(--muted);white-space:nowrap;
  background:var(--deck);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:color .15s,background .15s;
}
.modes button:hover{color:var(--text);background:var(--deck2)}
.modes button[aria-pressed=true]{background:var(--holo);color:#03131a}
.modes .n{font:600 13px var(--hud);margin-left:6px;opacity:.7}

/* ============ 筛选 ============ */
.filters{display:grid;gap:12px;padding:18px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{
  background:linear-gradient(var(--deck),var(--deck)) padding-box,linear-gradient(var(--edge),var(--edge)) border-box;border:1px solid transparent;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
}
.field:focus-within{background:linear-gradient(var(--deck),var(--deck)) padding-box,linear-gradient(var(--holo),var(--holo)) border-box}
.search{flex:1 1 280px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:16px;height:16px;color:var(--holo-dim)}
.search input{width:100%;height:40px;border:0;background:none;padding:0 12px 0 38px;outline:none}
.search input::placeholder{color:var(--dim)}
.search kbd{position:absolute;right:10px;font:600 12px var(--hud);color:var(--dim);border:1px solid var(--grid);padding:0 6px;border-radius:2px}
.sel{position:relative}
.sel select{appearance:none;height:40px;border:0;background:none;padding:0 32px 0 12px;outline:none;max-width:220px;cursor:pointer}
.sel:after{content:"";position:absolute;right:13px;top:17px;width:6px;height:6px;border-right:1.5px solid var(--holo);border-bottom:1.5px solid var(--holo);transform:rotate(45deg);pointer-events:none}
.sel select option{background:var(--deck);color:var(--text)}
.sel[hidden]{display:none}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.chips .lbl{color:var(--dim);font-size:12px;margin-right:4px;white-space:nowrap}
.chip{
  border:0;cursor:pointer;padding:5px 13px;white-space:nowrap;font-size:13px;color:var(--muted);
  background:linear-gradient(var(--void),var(--void)) padding-box,linear-gradient(var(--grid),var(--grid)) border-box;border:1px solid transparent;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{color:var(--holo);background:linear-gradient(#0b2633,#0b2633) padding-box,linear-gradient(var(--holo),var(--holo)) border-box}

.resline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12.5px;padding:10px 0 14px;border-bottom:1px solid var(--grid);margin-bottom:18px}
.resline .num{color:var(--holo);font-size:16px;font-weight:700}

/* ============ 方案卡 ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding-bottom:48px}
.card{
  position:relative;padding:16px 16px 14px;display:flex;flex-direction:column;gap:11px;
  background:linear-gradient(180deg,rgba(13,24,40,.92),rgba(8,14,24,.92));
  border:1px solid rgba(79,227,255,.10);
}
/* HUD 括角 */
.card:before,.card:after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--holo-dim);transition:border-color .2s,width .2s,height .2s;pointer-events:none}
.card:before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.card:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.card:hover:before,.card:hover:after{border-color:var(--holo);width:22px;height:22px}
.card.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,35%{border-color:var(--holo);box-shadow:0 0 0 1px var(--holo),0 0 30px rgba(79,227,255,.35)}100%{}}

.ch{display:flex;align-items:flex-start;gap:10px}
.wname{font-weight:700;font-size:16px;line-height:1.25;letter-spacing:.02em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;line-height:18px;padding:0 7px;color:var(--muted);background:rgba(120,145,171,.1);border-left:2px solid var(--edge)}
.tag.new{color:#fff;background:var(--alert);border-color:#fff;font:700 12px/18px var(--hud);letter-spacing:.1em}
.tag.qm{color:var(--holo);border-color:var(--holo-dim)}
.tag.hc{color:var(--amber);border-color:var(--amber)}
.price{margin-left:auto;text-align:right;flex:none}
.price .num{font-size:28px;font-weight:700;color:var(--amber);line-height:.95;text-shadow:0 0 16px rgba(255,181,71,.3)}
.price u{text-decoration:none;font-size:13px;color:var(--amber);margin-left:2px}
.price small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.price small.live{color:var(--ok)}
.price small.live:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}

.title{font-weight:600;color:var(--text)}
.desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 分段能量条 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 0 2px;border-top:1px dashed var(--grid)}
.stat{display:grid;grid-template-columns:5.2em 1fr auto;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.stat span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--grid);-webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo-dim),var(--holo))}
.stat .v{font:600 13px var(--hud);color:var(--text);min-width:3.4em;text-align:right}
.stat .v em{font-style:normal;color:var(--ok);margin-left:3px;font-size:12px}
.stat .v em.neg{color:var(--alert)}

.meta{display:flex;gap:12px;align-items:center;color:var(--dim);font-size:12px;flex-wrap:wrap}
.meta .num{font-size:13.5px;font-weight:600;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;border-bottom:1px dotted var(--dim)}
.linkbtn:hover{color:var(--holo);border-color:var(--holo)}
.src{margin-left:auto;display:flex;gap:5px}
.src a{text-decoration:none;font-size:11px;color:var(--holo-dim);border:1px solid var(--grid);padding:0 6px;line-height:18px}
.src a[href]:hover{color:var(--holo);border-color:var(--holo)}

.pic{display:none;border:1px solid var(--grid)}
.pic img{width:100%;display:block}
.card.open .pic{display:block}

/* 改枪码卡带：最有记忆点的部分 */
.cart{
  margin-top:auto;display:flex;align-items:stretch;
  background:linear-gradient(90deg,#0b2230,#08121e) padding-box,linear-gradient(90deg,var(--holo-dim),var(--edge)) border-box;
  border:1px solid transparent;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
}
.cart .body{flex:1;min-width:0;padding:8px 12px 9px}
.cart .pre{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart .core{display:flex;flex-wrap:wrap;gap:2px 10px;font:700 16px/1.25 var(--hud);letter-spacing:.09em;color:var(--holo);text-shadow:0 0 10px rgba(79,227,255,.35);white-space:nowrap}
.cart .core span{position:relative}
.cart .core span+span:before{content:"";position:absolute;left:-7px;top:4px;bottom:4px;width:1px;background:var(--holo-dim)}
.cart button{
  border:0;cursor:pointer;padding:0 16px;font-weight:700;letter-spacing:.06em;white-space:nowrap;
  background:var(--holo);color:#03131a;transition:filter .15s;
}
.cart button:hover{filter:brightness(1.15)}
.cart button:active{filter:brightness(.9)}
.cart.done button{background:var(--ok)}

.empty,.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 0}
.loading:before{content:"";display:block;width:40px;height:40px;margin:0 auto 14px;border:1.5px solid var(--grid);border-top-color:var(--holo);border-radius:50%;animation:sweep 1s linear infinite}
.more{grid-column:1/-1;height:1px}

/* ============ 作战日志抽屉 ============ */
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:rgba(6,11,19,.97);border-left:1px solid var(--edge);z-index:40;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,4,10,.6);z-index:39;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.open{opacity:1;pointer-events:auto}
.dh{display:flex;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 16px 18px;border-bottom:1px solid var(--edge)}
.dh h2{margin:0;font-size:15px;letter-spacing:.06em}
.dh .btn{margin-left:auto}
.dbody{overflow:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 18px}
.dbody h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:18px 0 8px}
.srcrow{display:grid;grid-template-columns:10px 1fr auto;gap:4px 10px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--grid)}
.srcrow .s{width:7px;height:7px;background:var(--dim);transform:rotate(45deg)}
.srcrow .s.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.srcrow .s.bad{background:var(--alert)}
.srcrow .c{font:600 14px var(--hud);color:var(--text)}
.srcrow .e{grid-column:2/-1;color:var(--dim);font-size:11.5px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--grid);font-size:13px}
.ev .t{grid-column:1/-1;color:var(--dim);font:500 12.5px var(--hud);letter-spacing:.04em}
.ev .k{font-weight:700;font-size:12px;padding:0 6px;line-height:20px;align-self:start}
.ev .k.added{color:#03131a;background:var(--holo)} .ev .k.removed{color:#fff;background:var(--alert)} .ev .k.updated{color:#1a1203;background:var(--amber)} .ev .k.init{color:var(--muted);background:var(--grid)}
.ev code{display:block;font:600 13px var(--hud);letter-spacing:.06em;color:var(--holo-dim);word-break:break-all}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:rgba(10,18,32,.96);border:1px solid var(--edge);border-left:3px solid var(--holo);color:var(--text);padding:11px 18px;font-weight:600;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{position:relative;z-index:1;color:var(--dim);font-size:12px;padding:22px 0 44px;border-top:1px solid var(--grid)}
footer a{color:var(--muted)}

@media (max-width:640px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand p,.link .txt{display:none}
  .readout{gap:18px}.readout .num{font-size:21px}
  .grid{grid-template-columns:1fr}
  .search{flex-basis:100%}
  .sel{flex:1 1 0;min-width:0}.sel select{max-width:none;width:100%;padding-right:26px}
  .stats{grid-template-columns:1fr}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <span class="radar" aria-hidden="true"></span>
        <div><h1>三角洲改枪码库</h1><p>DELTA FORCE GUNSMITH</p></div>
      </div>
      <div class="link" id="live"><span class="sig" aria-hidden="true"><i></i><i></i><i></i></span><span class="txt" id="liveTxt">正在连接</span></div>
      <button class="btn" id="openLog" aria-label="查看数据动态">数据动态 <span class="badge" id="logBadge" hidden>0</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="readout" aria-label="收录概况">
    <div class="first"><span class="num" id="rTotal">—</span>套方案</div>
    <div><span class="num" id="rWeapons">—</span>把武器</div>
    <div><span class="num" id="rAuthors">—</span>位作者</div>
    <div><span class="num" id="rSources">—</span>个数据源在线</div>
  </section>
  <nav class="modes" id="modes" aria-label="游戏模式"></nav>

  <section class="filters">
    <div class="row">
      <label class="search field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜武器、作者、描述或改枪码" autocomplete="off" aria-label="搜索">
        <kbd>/</kbd>
      </label>
      <label class="sel field"><select id="weapon" aria-label="武器"><option value="">全部武器</option></select></label>
      <label class="sel field" id="authorWrap"><select id="author" aria-label="作者"><option value="">全部作者</option></select></label>
      <label class="sel field"><select id="sort" aria-label="排序">
        <option value="hot">最热门</option>
        <option value="new">最新收录</option>
        <option value="updated">最近变动</option>
        <option value="price_asc">造价从低到高</option>
        <option value="price_desc">造价从高到低</option>
      </select></label>
    </div>
    <div class="chips" id="cats"></div>
    <div class="chips" id="prices"></div>
  </section>
  <div class="resline"><span>筛选出 <span class="num" id="count">0</span> 套</span><span id="srcSummary"></span></div>
  <section class="grid" id="grid" aria-live="polite"><div class="loading">正在载入改枪码</div></section>
</main>

<footer><div class="wrap">
  数据来自 <span id="footSrc">各公开数据源</span>，版权归原作者所有。改枪码以游戏内导入结果为准，本站只做聚合与导航。
</div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="数据动态">
  <div class="dh"><h2>数据动态</h2><button class="btn" id="closeLog">关闭</button></div>
  <div class="dbody">
    <h3>数据源</h3>
    <div id="srcs"></div>
    <h3>变动记录</h3>
    <div id="events"></div>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const MODES = ['烽火地带', '全面战场', '黑潮爆破'];
const CATS = ['步枪', '冲锋枪', '精确射手步枪', '狙击步枪', '轻机枪', '霰弹枪', '手枪', '特殊武器'];
const PRICES = [['', '不限'], ['0-15', '15万以内'], ['15-30', '15–30万'], ['30-60', '30–60万'], ['60-', '60万以上']];
const SRC_NAME = { aitags: '改枪码大全', 'aitags-streamer': '主播同款', orzice: '小涛查', manual: '自录' };
const PAGE = 60;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PREVIEW = !!window.DFG_PREVIEW;   // 静态预览：图片外链不可用、不写地址栏

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';

const S = { mode: '烽火地带', cat: '', price: '', weapon: '', author: '', q: '', sort: 'hot' };
let DATA = { items: [], sources: [], updatedAt: null };
let filtered = [], shown = 0, newSince = 0, unseen = 0, apiMode = true;
const flashKeys = new Set();

// ---------- URL 状态 ----------
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of Object.keys(S)) if (p.has(k)) S[k] = p.get(k);
}
function writeHash() {
  if (PREVIEW) return;
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(S)) if (v && !(k === 'mode' && v === '烽火地带') && !(k === 'sort' && v === 'hot')) p.set(k, v);
  history.replaceState(null, '', p.toString() ? '#' + p : location.pathname + location.search);
}

// ---------- 数据 ----------
async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load() {
  try {
    const [codes, meta] = await Promise.all([fetchJSON('api/codes?limit=2000'), fetchJSON('api/meta')]);
    DATA = { items: codes.items, sources: meta.sources, updatedAt: meta.updatedAt };
    apiMode = true;
  } catch {
    DATA = await fetchJSON('data/codes.json');   // 静态部署（GitHub Pages 等）
    apiMode = false;
  }
  const first = DATA.items.reduce((m, it) => it.firstSeen < m ? it.firstSeen : m, '9');
  newSince = Math.max(Date.parse(first) + 5 * 60e3, Date.now() - 48 * 3600e3);
  // 同一把枪统一显示名与分类
  const names = {}, cats = {};
  for (const it of DATA.items) {
    if (!names[it.weaponKey] || it.weapon.length > names[it.weaponKey].length) names[it.weaponKey] = it.weapon;
    if (it.category && !cats[it.weaponKey]) cats[it.weaponKey] = it.category;
  }
  for (const it of DATA.items) { it.weapon = names[it.weaponKey]; if (!it.category) it.category = cats[it.weaponKey] || ''; }
}
async function loadChanges() {
  try { return (await fetchJSON(apiMode ? 'api/changes' : 'data/changes.json')).events || []; } catch { return []; }
}

// ---------- 过滤 ----------
function apply() {
  const q = S.q.trim().toLowerCase();
  const [pmin, pmax] = S.price ? S.price.split('-').map(x => x === '' ? null : Number(x)) : [null, null];
  filtered = DATA.items.filter(it =>
    it.mode === S.mode &&
    (!S.cat || it.category === S.cat) &&
    (!S.weapon || it.weaponKey === S.weapon) &&
    (!S.author || it.author === S.author) &&
    (pmin == null || (it.price != null && it.price >= pmin)) &&
    (pmax == null || (it.price != null && it.price < pmax)) &&
    (!q || (it.weapon + ' ' + it.title + ' ' + it.desc + ' ' + it.author + ' ' + it.code).toLowerCase().includes(q))
  );
  const by = {
    hot: (a, b) => b.hot - a.hot,
    new: (a, b) => b.firstSeen.localeCompare(a.firstSeen) || b.hot - a.hot,
    updated: (a, b) => b.updatedAt.localeCompare(a.updatedAt) || b.hot - a.hot,
    price_asc: (a, b) => (a.price ?? 1e9) - (b.price ?? 1e9),
    price_desc: (a, b) => (b.price ?? -1) - (a.price ?? -1),
  }[S.sort] || ((a, b) => b.hot - a.hot);
  filtered.sort(by);
  $('count').textContent = filtered.length;
  shown = 0;
  $('grid').innerHTML = '';
  writeHash();
  if (!filtered.length) {
    $('grid').innerHTML = DATA.items.length
      ? '<div class="empty">没有符合条件的方案，放宽筛选条件再试试</div>'
      : '<div class="loading">正在采集数据，完成后页面会自动刷新</div>';
    return;
  }
  more();
}

// ---------- 渲染 ----------
const fmtNum = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
function splitCode(code) {
  const m = String(code).match(/^(.*?)-?([0-9A-Za-z]{18,24})\s*$/);
  const pre = m ? m[1].replace(/-(烽火地带|全面战场|黑潮爆破)$/, ' / $1') : '';
  const core = (m ? m[2] : code).toUpperCase();
  return { pre, groups: core.match(/.{1,7}/g) || [core] };
}
function card(it) {
  const isNew = Date.parse(it.firstSeen) > newSince;
  const modeTag = it.mode === '全面战场' ? 'qm' : it.mode === '黑潮爆破' ? 'hc' : '';
  const stats = (it.stats || []).slice(0, 6).map(s => {
    const ch = String(s.change || '').trim();
    const neg = ch.startsWith('-') && ch !== '-';
    const show = ch && ch !== '-' && ch !== '0' && ch !== '+0';
    const w = Math.max(0, Math.min(100, Number(s.value) || 0));
    return `<div class="stat"><span title="${esc(s.name)}">${esc(s.name)}</span><span class="bar"><i style="width:${w}%"></i></span><span class="v">${esc(s.value)}${show ? `<em class="${neg ? 'neg' : ''}">${esc(ch)}</em>` : ''}</span></div>`;
  }).join('');
  const srcs = it.sources.map(s => {
    const u = safeUrl(s.url), name = esc(SRC_NAME[s.id] || s.id);
    return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${name}</a>` : `<a>${name}</a>`;
  }).join('');
  const img = safeUrl(it.image);
  const { pre, groups } = splitCode(it.code);
  const el = document.createElement('article');
  el.className = 'card' + (flashKeys.has(it.key) ? ' flash' : '');
  el.innerHTML = `
    <div class="ch">
      <div>
        <div class="wname">${esc(it.weapon)}</div>
        <div class="tags">${isNew ? '<span class="tag new">NEW</span>' : ''}${it.category ? `<span class="tag">${esc(it.category)}</span>` : ''}${modeTag ? `<span class="tag ${modeTag}">${esc(it.mode)}</span>` : ''}</div>
      </div>
      <div class="price">${it.price != null
        ? `<span class="num">${esc(it.price)}</span><u>万</u><small class="${it.priceLive ? 'live' : ''}">${it.priceLive ? '实时造价' : '收录时造价'}</small>`
        : '<small>造价未标注</small>'}</div>
    </div>
    ${it.title ? `<div class="title">${esc(it.title)}</div>` : ''}
    ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ''}
    ${stats ? `<div class="stats">${stats}</div>` : ''}
    <div class="meta">
      ${it.author ? `<button class="linkbtn" data-author="${esc(it.author)}" title="只看 ${esc(it.author)} 的方案">${esc(it.author)}</button>` : ''}
      ${it.copies ? `<span><span class="num">${fmtNum(it.copies)}</span> 次使用</span>` : ''}
      ${it.likes ? `<span><span class="num">${fmtNum(it.likes)}</span> 赞</span>` : ''}
      ${img && !PREVIEW ? '<button class="linkbtn" data-pic>配装图</button>' : ''}
      <span class="src">${srcs}</span>
    </div>
    ${img ? `<div class="pic"><img data-src="${esc(img)}" alt="${esc(it.weapon)} 配装图" referrerpolicy="no-referrer" loading="lazy"></div>` : ''}
    <div class="cart">
      <div class="body">
        ${pre ? `<div class="pre">${esc(pre)}</div>` : ''}
        <div class="core" aria-label="改枪码 ${esc(it.code)}">${groups.map(g => `<span>${esc(g)}</span>`).join('')}</div>
      </div>
      <button data-copy="${esc(it.code)}">复制</button>
    </div>`;
  return el;
}
const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, { rootMargin: '600px' });
function more() {
  const grid = $('grid');
  grid.querySelector('.more')?.remove();
  const frag = document.createDocumentFragment();
  for (const it of filtered.slice(shown, shown + PAGE)) frag.appendChild(card(it));
  shown = Math.min(filtered.length, shown + PAGE);
  grid.appendChild(frag);
  if (shown < filtered.length) { const s = document.createElement('div'); s.className = 'more'; grid.appendChild(s); io.observe(s); }
}

function renderReadout() {
  $('rTotal').textContent = DATA.items.length;
  $('rWeapons').textContent = new Set(DATA.items.map(i => i.weaponKey)).size;
  $('rAuthors').textContent = new Set(DATA.items.map(i => i.author).filter(Boolean)).size;
  $('rSources').textContent = DATA.sources.filter(s => s.ok).length;
}
function renderModes() {
  const n = {}; for (const it of DATA.items) n[it.mode] = (n[it.mode] || 0) + 1;
  $('modes').innerHTML = MODES.filter(m => n[m] || m !== '黑潮爆破').map(m =>
    `<button data-mode="${m}" aria-pressed="${S.mode === m}">${m}<span class="n">${n[m] || 0}</span></button>`).join('');
}
function renderChips() {
  $('cats').innerHTML = '<span class="lbl">分类</span>' + ['', ...CATS].map(c => `<button class="chip" data-cat="${c}" aria-pressed="${S.cat === c}">${c || '全部'}</button>`).join('');
  $('prices').innerHTML = '<span class="lbl">造价</span>' + PRICES.map(([v, l]) => `<button class="chip" data-price="${v}" aria-pressed="${S.price === v}">${l}</button>`).join('');
}
function renderWeapons() {
  const map = new Map();
  for (const it of DATA.items) {
    if (it.mode !== S.mode || (S.cat && it.category !== S.cat)) continue;
    const w = map.get(it.weaponKey) || { name: it.weapon, n: 0 };
    w.n++; map.set(it.weaponKey, w);
  }
  if (S.weapon && !map.has(S.weapon)) S.weapon = '';
  const opts = [...map].sort((a, b) => a[1].name.localeCompare(b[1].name, 'zh')).map(([k, w]) => `<option value="${esc(k)}"${k === S.weapon ? ' selected' : ''}>${esc(w.name)}（${w.n}）</option>`);
  $('weapon').innerHTML = '<option value="">全部武器</option>' + opts.join('');
}
function renderAuthors() {
  const n = {};
  for (const it of DATA.items) if (it.author && it.mode === S.mode) n[it.author] = (n[it.author] || 0) + 1;
  if (S.author && !n[S.author]) S.author = '';
  const list = Object.entries(n).sort((a, b) => b[1] - a[1]);
  $('authorWrap').hidden = !list.length;
  $('author').innerHTML = '<option value="">全部作者</option>' + list.map(([a, c]) => `<option value="${esc(a)}"${a === S.author ? ' selected' : ''}>${esc(a)}（${c}）</option>`).join('');
}
function renderSources() {
  const ok = DATA.sources.filter(s => s.ok);
  $('srcSummary').textContent = ok.length ? `数据来自 ${ok.map(s => SRC_NAME[s.id] || s.id).join('、')}` : '';
  $('footSrc').innerHTML = DATA.sources.filter(s => s.count).map(s => safeUrl(s.homepage) ? `<a href="${esc(s.homepage)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>` : esc(s.label)).join('、') || '各公开数据源';
  $('srcs').innerHTML = DATA.sources.map(s => `<div class="srcrow"><span class="s ${s.ok ? 'ok' : s.skipped ? '' : 'bad'}"></span><span>${esc(s.label || s.id)}</span><span class="c">${s.count || 0} 条</span><span class="e">${s.ok ? '上次同步 ' + ago(s.fetchedAt) : esc(s.error || '')}</span></div>`).join('');
}
function ago(t) {
  if (!t) return '—';
  const s = (Date.now() - Date.parse(t)) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return new Date(t).toLocaleDateString('zh-CN');
}
function renderLive(state) {
  $('live').className = 'link ' + (state || '');
  const head = PREVIEW ? '预览快照' : state === 'on' ? '实时同步中' : state === 'poll' ? '定时刷新' : '连接中断，正在重连';
  $('liveTxt').innerHTML = `${head}，上次更新 <b>${esc(ago(DATA.updatedAt))}</b>`;
}
async function renderEvents() {
  const evs = await loadChanges();
  const label = { added: '新增', removed: '下架', updated: '变动', init: '建库' };
  const ts = t => new Date(t).toLocaleString('zh-CN', { hour12: false });
  $('events').innerHTML = evs.length ? evs.slice(0, 200).map(e => e.type === 'init'
    ? `<div class="ev"><span class="t">${esc(ts(e.at))}</span><span class="k init">建库</span><span>首次收录 ${esc(e.count)} 套方案</span></div>`
    : `<div class="ev"><span class="t">${esc(ts(e.at))}  ${esc(e.mode || '')}</span><span class="k ${esc(e.type)}">${label[e.type] || esc(e.type)}</span><span>${esc(e.weapon || '')}${e.changed ? ` <span style="color:var(--dim)">${esc(e.changed.join('、'))}</span>` : ''}<code>${esc(e.code || '')}</code></span></div>`).join('')
    : '<div class="ev" style="color:var(--muted)">暂时没有变动记录</div>';
}
function renderAll() { renderReadout(); renderModes(); renderChips(); renderWeapons(); renderAuthors(); renderSources(); apply(); }

// ---------- 交互 ----------
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2000);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch { }
    ta.remove(); return ok;
  }
}
// 复制成功：改枪码逐位“解密”落定
function decrypt(coreEl) {
  if (REDUCED) return;
  const spans = [...coreEl.children];
  const finals = spans.map(s => s.textContent);
  const total = finals.join('').length;
  const CH = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const start = performance.now(), dur = 520;
  (function frame(now) {
    const done = Math.floor(Math.min(1, (now - start) / dur) * total);
    let i = 0;
    spans.forEach((s, k) => {
      s.textContent = [...finals[k]].map(c => (i++ < done ? c : CH[(Math.random() * 36) | 0])).join('');
    });
    if (done < total) requestAnimationFrame(frame); else spans.forEach((s, k) => { s.textContent = finals[k]; });
  })(start);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy != null) {
    const cart = b.closest('.cart');
    if (await copy(b.dataset.copy)) {
      decrypt(cart.querySelector('.core'));
      cart.classList.add('done'); b.textContent = '已复制';
      toast('已复制。进游戏打开改装，选择方案导入后粘贴');
      setTimeout(() => { b.textContent = '复制'; cart.classList.remove('done'); }, 1800);
    } else toast('复制失败，请长按改枪码手动复制');
  } else if (b.dataset.pic != null) {
    const c = b.closest('.card'); c.classList.toggle('open');
    const img = c.querySelector('img[data-src]'); if (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
    b.textContent = c.classList.contains('open') ? '收起配装图' : '配装图';
  } else if (b.dataset.mode) { S.mode = b.dataset.mode; S.weapon = ''; renderModes(); renderWeapons(); renderAuthors(); apply(); }
  else if (b.dataset.cat != null) { S.cat = b.dataset.cat; S.weapon = ''; renderChips(); renderWeapons(); apply(); }
  else if (b.dataset.author != null) { S.author = b.dataset.author; renderAuthors(); apply(); scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); }
  else if (b.dataset.price != null) { S.price = b.dataset.price; renderChips(); apply(); }
});
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; apply(); }, 150); });
$('weapon').addEventListener('change', e => { S.weapon = e.target.value; apply(); });
$('author').addEventListener('change', e => { S.author = e.target.value; apply(); });
$('sort').addEventListener('change', e => { S.sort = e.target.value; apply(); });
const openLog = open => { $('drawer').classList.toggle('open', open); $('scrim').classList.toggle('open', open); if (open) { unseen = 0; $('logBadge').hidden = true; renderEvents(); } };
$('openLog').onclick = () => openLog(true);
$('closeLog').onclick = $('scrim').onclick = () => openLog(false);
addEventListener('keydown', e => {
  if (e.key === 'Escape') openLog(false);
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) { e.preventDefault(); $('q').focus(); }
});

// ---------- 实时 ----------
async function refresh() {
  const before = new Set(DATA.items.map(i => i.key));
  await load();
  flashKeys.clear();
  for (const it of DATA.items) if (!before.has(it.key)) flashKeys.add(it.key);
  const added = flashKeys.size, keep = scrollY;
  renderAll(); scrollTo(0, keep);
  if (added && before.size) {
    toast(`新收录 ${added} 套改枪方案`);
    unseen += added; $('logBadge').textContent = unseen; $('logBadge').hidden = false;
  }
  renderLive(apiMode ? 'on' : 'poll');
}
function connect() {
  if (!apiMode || !window.EventSource) { setInterval(() => refresh().catch(() => { }), 5 * 60e3); renderLive('poll'); return; }
  const es = new EventSource('api/stream');
  es.addEventListener('hello', () => renderLive('on'));
  es.addEventListener('update', () => refresh());
  es.addEventListener('tick', e => { DATA.updatedAt = JSON.parse(e.data).at; renderLive('on'); });
  es.onerror = () => renderLive('');
}
setInterval(() => { renderLive($('live').classList.contains('on') ? 'on' : apiMode ? '' : 'poll'); renderSources(); }, 30e3);

// ---------- 启动 ----------
readHash();
$('q').value = S.q; $('sort').value = S.sort;
load().then(() => { renderAll(); renderLive(apiMode ? 'on' : 'poll'); connect(); })
  .catch(err => { $('grid').innerHTML = `<div class="empty">数据加载失败（${esc(err.message)}），请稍后刷新页面</div>`; });
})();
</script>
</body>
</html>
