# 无服务器方案：GitHub Actions 每 10 分钟采集一次 → 提交数据 → 发布到 GitHub Pages
# 使用：仓库 Settings → Pages → Source 选 "GitHub Actions"；
#       如需 orzice 数据，在 Settings → Secrets → Actions 添加 ORZICE_TOKEN。
name: collect

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub 的定时任务高峰期可能延迟几分钟
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/index.html", "data/manual.json", "src/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        env:
          ORZICE_TOKEN: ${{ secrets.ORZICE_TOKEN }}
          ORZICE_BLACKTIDE: ${{ vars.ORZICE_BLACKTIDE }}
        run: node src/cli.js
      - name: Commit data
        run: |
          git config user.name "gunsmith-bot"
          git config user.email "gunsmith-bot@users.noreply.github.com"
          git add public/data data/cache
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
