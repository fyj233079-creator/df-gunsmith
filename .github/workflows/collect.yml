# 无服务器方案：GitHub Actions 每 10 分钟采集一次 → 发布到 GitHub Pages
# 采集结果保存在 Actions 缓存里（不提交进仓库，避免仓库膨胀和并发提交冲突）；
# 缓存丢失时会从仓库里的 public/data 种子数据继续，firstSeen 不受影响。
# 使用：仓库 Settings → Pages → Source 选 "GitHub Actions"；
#       如需 orzice 数据，在 Settings → Secrets → Actions 添加 ORZICE_TOKEN。
name: collect

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub 的定时任务高峰期可能延迟几分钟
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "data/manual.json", "src/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data
            data/cache
          key: dfg-data-${{ github.run_id }}
          restore-keys: dfg-data-
      - name: Collect
        env:
          ORZICE_TOKEN: ${{ secrets.ORZICE_TOKEN }}
          ORZICE_BLACKTIDE: ${{ vars.ORZICE_BLACKTIDE }}
        run: node src/cli.js
      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            public/data
            data/cache
          key: dfg-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
